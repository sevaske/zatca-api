name: Tests

on:
  push:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'phpunit.xml'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - '**/*.php'
      - 'composer.json'
      - 'phpunit.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: [7.4, 8.0, 8.1, 8.2, 8.3, 8.4]
        stability: [stable]
        include:
          - php: 8.2
            stability: lowest

    name: PHP ${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, json
          coverage: none
          ini-values: memory_limit=1G

      - name: Cache Composer packages
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ matrix.stability }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies (stable)
        if: matrix.stability == 'stable'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install dependencies (prefer-lowest)
        if: matrix.stability == 'lowest'
        run: composer update --prefer-lowest --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml